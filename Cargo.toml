[workspace]
members = [
    "crates/schwarz-precond",
    "crates/within",
    "crates/within-py",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/py-econometrics/within"
categories = ["mathematics", "science", "algorithms"]

[workspace.dependencies]
schwarz-precond = { version = "0.4.0", path = "crates/schwarz-precond" }
faer = "0.24.4"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Release-equivalent build that keeps line-level debug info so samply/perf/
# dtrace can resolve stack frames. Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
