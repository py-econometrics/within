name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: pixi run -e default cargo fmt --all -- --check
      - name: cargo clippy
        run: pixi run -e default cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: pixi run -e default cargo test --workspace --all-features
      - name: pytest
        run: pixi run test

  platform:
    name: Tests (${{ matrix.os }})
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: pixi run -e default cargo test --workspace --all-features
      - name: pytest
        run: pixi run test

  r-bindings:
    name: R bindings (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: withinr/src/rust
      - name: cargo fmt (bridge crate)
        run: cargo fmt --manifest-path withinr/src/rust/Cargo.toml -- --check
      - name: Install package (dev mode, against the workspace crate)
        run: NOT_CRAN=true R CMD INSTALL withinr
      - name: Run R test suite
        run: Rscript withinr/tests/run_tests.R

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Run coverage
        run: pixi run coverage
