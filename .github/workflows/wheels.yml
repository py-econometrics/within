name: Wheels

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-wheels.yml

  # Static check: the built wheel must use only the py3.9 limited API, so the
  # single cp39-abi3 wheel is genuinely valid on every later CPython.
  abi3audit:
    name: abi3 compliance audit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: audit
          cache: true
      - run: pixi run -e audit abi3audit dist/*.whl

  # Dynamic check: the one abi3 wheel installs and runs on every supported
  # CPython, from the 3.9 floor through the latest release.
  import-test:
    name: Import + smoke solve (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install wheel and smoke-solve
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python .github/workflows/smoke_solve.py

  import-test-nonabi3:
    name: Import + smoke solve (${{ matrix.python-version }}, ${{ matrix.wheel-suffix }})
    runs-on: ${{ matrix.runner }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            wheel-suffix: linux-nonabi3-x86_64
            python-version: "3.14t"
            wheel-glob: "*cp314-cp314t*"
          - runner: ubuntu-latest
            wheel-suffix: linux-nonabi3-x86_64
            python-version: "pypy3.11"
            wheel-glob: "*pp311*"
          - runner: ubuntu-24.04-arm
            wheel-suffix: linux-nonabi3-aarch64
            python-version: "3.14t"
            wheel-glob: "*cp314-cp314t*"
          - runner: ubuntu-24.04-arm
            wheel-suffix: linux-nonabi3-aarch64
            python-version: "pypy3.11"
            wheel-glob: "*pp311*"
          - runner: macos-15-intel
            wheel-suffix: macos-nonabi3-x86_64
            python-version: "3.14t"
            wheel-glob: "*cp314-cp314t*"
          - runner: macos-15-intel
            wheel-suffix: macos-nonabi3-x86_64
            python-version: "pypy3.11"
            wheel-glob: "*pp311*"
          - runner: macos-latest
            wheel-suffix: macos-nonabi3-aarch64
            python-version: "3.14t"
            wheel-glob: "*cp314-cp314t*"
          - runner: macos-latest
            wheel-suffix: macos-nonabi3-aarch64
            python-version: "pypy3.11"
            wheel-glob: "*pp311*"
          - runner: windows-latest
            wheel-suffix: windows-nonabi3-x64
            python-version: "3.14t"
            wheel-glob: "*cp314-cp314t*"
          - runner: windows-latest
            wheel-suffix: windows-nonabi3-x64
            python-version: "pypy3.11"
            wheel-glob: "*pp311*"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.wheel-suffix }}
          path: dist
      - name: Install wheel and smoke-solve
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/${{ matrix.wheel-glob }}.whl
          python .github/workflows/smoke_solve.py
