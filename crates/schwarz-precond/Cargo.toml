[package]
name = "schwarz-precond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Schwarz domain decomposition preconditioner"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["schwarz", "preconditioner", "domain-decomposition", "sparse", "iterative-solver"]
categories.workspace = true

[features]
serde = ["dep:serde"]
# Pool helpers for tests in dependent crates.
testing = []

[dependencies]
dyn-stack = { version = "0.13.2", default-features = false, features = ["alloc"] }
rayon.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
schwarz-precond = { path = ".", features = ["testing"] }
faer.workspace = true
postcard.workspace = true
rstest.workspace = true

[lints]
workspace = true
