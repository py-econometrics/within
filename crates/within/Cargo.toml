[package]
name = "within"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fixed-effects normal equation solver with Schwarz preconditioning"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["fixed-effects", "least-squares", "preconditioner", "schwarz", "econometrics"]
categories.workspace = true

[features]
default = []
ndarray = ["dep:ndarray"]

[dependencies]
schwarz-precond = { workspace = true, features = ["serde"] }
approx-chol = { version = "0.3.1", features = ["serde"] }
serde = { workspace = true, features = ["rc"] }
postcard.workspace = true
ndarray = { version = "0.17", optional = true }
portable-atomic = { version = "1", features = ["float"] }
rayon.workspace = true
faer.workspace = true
thiserror.workspace = true

[dev-dependencies]
within = { path = ".", features = ["ndarray"] }
ndarray = "0.17"
criterion = { version = "0.7", features = ["html_reports"] }
rand = "0.10"
proptest = "1"

[[bench]]
name = "fixest"
harness = false

[[bench]]
name = "store_backend"
harness = false

[[bench]]
name = "wallclock_1m3fe"
harness = false

[lints]
workspace = true
