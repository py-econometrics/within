[package]
name = "within"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fixed-effects normal equation solver with Schwarz preconditioning"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["fixed-effects", "least-squares", "preconditioner", "schwarz", "econometrics"]
categories.workspace = true

[dependencies]
schwarz-precond = { workspace = true, features = ["serde"] }
approx-chol = { version = "0.8.2", features = ["serde"] }
inflight.workspace = true
serde = { workspace = true, features = ["rc"] }
postcard.workspace = true
ndarray = "0.17"
once_cell.workspace = true
rayon.workspace = true
thiserror.workspace = true
rustc-hash = "2"

[dev-dependencies]
inflight = { workspace = true, features = ["testing"] }
criterion = { version = "0.7", features = ["html_reports"] }
rand = "0.10"
proptest = "1"
rstest.workspace = true

[[bench]]
name = "fixest"
harness = false

[[bench]]
name = "store_backend"
harness = false

[[bench]]
name = "wallclock_1m3fe"
harness = false

# probe: the counting allocator needs unsafe denied, not forbidden
[lints.rust]
unsafe_code = "deny"
