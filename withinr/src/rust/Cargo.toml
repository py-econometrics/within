[package]
name = "withinr"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

# Detach from the repo root workspace to avoid nested-workspace Cargo errors.
[workspace]

[dependencies]
extendr-api = "0.8"
ndarray = "0.16"
postcard = { version = "1.1", features = ["use-std"] }

within = "0.2.0"
