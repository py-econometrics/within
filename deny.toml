# cargo-deny configuration: run via `cargo deny check` (advisories, licenses,
# bans, sources). See https://embarkstudios.github.io/cargo-deny/ for the
# full schema; unset fields fall back to cargo-deny's defaults.

[graph]
# Matches the platforms declared in pixi.toml so target-only crates (e.g.
# r-efi, only pulled in for UEFI targets) don't spuriously appear in the
# license/bans graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
# Each entry is a pre-existing, transitive advisory that isn't fixable by a
# lockfile bump alone (unlike crossbeam-epoch, resolved instead by updating
# past 0.9.18); tracked to revisit, not silently accepted.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "transitive `paste` dep is unmaintained (no vulnerability); no drop-in replacement upstream" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
# "deny" plus an explicit `skip` grandfathering list: any *new* duplicate
# crate/version pulled in by a future change still fails the check.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "rand@0.8.7", reason = "transitive duplicate; dev-dep is on rand 0.10, num-complex/faer pull the older line" },
    { crate = "rand_core@0.6.4", reason = "pre-existing transitive duplicate (criterion vs faer/approx-chol chains)" },
    { crate = "syn@2.0.119", reason = "transitive duplicate; serde_derive is on syn 3, faer's enum-as-inner/sysctl chain still on syn 2" },
    # within depends on faer for the coarse LDLᵀ; faer's own tree pins these older lines.
    { crate = "equator@0.2.2", reason = "faer → nano-gemm; faer itself is on equator 0.6" },
    { crate = "equator-macro@0.2.1", reason = "faer → nano-gemm → equator 0.2" },
    { crate = "equator@0.4.2", reason = "faer → spindle; faer itself is on equator 0.6" },
    { crate = "equator-macro@0.4.2", reason = "faer → spindle → equator 0.4" },
    { crate = "rand@0.9.5", reason = "faer's rand feature (all-features graph); approx-chol is on rand 0.10" },
    { crate = "rand_core@0.9.5", reason = "faer → rand 0.9; approx-chol is on rand_core 0.10" },
    { crate = "getrandom@0.3.4", reason = "faer → rand 0.9; approx-chol is on getrandom 0.4" },
    { crate = "syn@1.0.109", reason = "faer → private-gemm-x86 → interpol (build-dependency proc-macro)" },
    { crate = "thiserror@1.0.69", reason = "faer → gemm-common → sysctl; within is on thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "faer → gemm-common → sysctl → thiserror 1" },
    { crate = "windows-sys@0.42.0", reason = "faer → spindle → atomic-wait (Windows target only)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
